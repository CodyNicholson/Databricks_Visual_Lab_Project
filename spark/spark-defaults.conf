# The lab's "cluster": one Spark Connect server in local mode (driver + 4 task slots).
spark.master                                   local[4]
spark.driver.memory                            1536m
spark.sql.shuffle.partitions                   8
spark.ui.port                                  4040
spark.sql.warehouse.dir                        /lakehouse/warehouse
# Size Delta's internals for one small node instead of a big cluster: log replay (default 50
# partitions) and VACUUM's parallel file listing (default 10000 tasks) dominate tiny tables.
spark.databricks.delta.snapshotPartitions      2
spark.sql.sources.parallelPartitionDiscovery.parallelism 4

# Delta Lake, as Databricks Runtime has it built in. Databricks also makes Delta the default
# table format; open-source Spark defaults to Parquet, so set it explicitly.
spark.sql.extensions                           io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.sources.default                      delta
spark.connect.extensions.relation.classes      org.apache.spark.sql.connect.delta.DeltaRelationPlugin
spark.connect.extensions.command.classes       org.apache.spark.sql.connect.delta.DeltaCommandPlugin

# Unity Catalog: each Spark catalog name maps to the UC catalog with the same name.
# `main` is the default, like a Databricks workspace; `samples` holds the read-only demo data.
spark.sql.catalog.main                         io.unitycatalog.spark.UCSingleCatalog
spark.sql.catalog.main.uri                     http://unitycatalog:8080
spark.sql.catalog.main.token
spark.sql.catalog.samples                      io.unitycatalog.spark.UCSingleCatalog
spark.sql.catalog.samples.uri                  http://unitycatalog:8080
spark.sql.catalog.samples.token
spark.sql.defaultCatalog                       main

# The /lakehouse volume is shared by the Spark server (uid 185), the UC server (uid 100) and the
# backend (uid 185): create group/world-writable files so UC can add model and volume folders.
spark.hadoop.fs.permissions.umask-mode         000
