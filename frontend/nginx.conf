server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so nginx starts even if the backend isn't up yet
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # Hashed build assets never change, so let browsers cache them
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Client-side routing: unknown paths fall back to the app
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256k;

        # Server-Sent Events: stream live events straight through, keep connections open
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
