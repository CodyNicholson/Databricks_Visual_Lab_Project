# Isolated test stack:
#   docker compose -p databricks-lab-test -f docker-compose.yml -f docker-compose.test.yml up -d --build
# Renames every container, drops all host ports except the UI on 127.0.0.1:3900 and keeps
# the frontend off the external network, so it never clashes with the live app.
# Every service with a container_name in docker-compose.yml needs an entry here.
services:
  unitycatalog:
    container_name: databricks-lab-test-unitycatalog
    restart: "no"

  spark:
    container_name: databricks-lab-test-spark
    restart: "no"

  mlflow:
    container_name: databricks-lab-test-mlflow
    restart: "no"

  backend:
    container_name: databricks-lab-test-backend
    ports: !reset []
    restart: "no"

  frontend:
    container_name: databricks-lab-test-frontend
    ports: !override
      - "127.0.0.1:3900:80"
    restart: "no"
    networks: !override
      - default
